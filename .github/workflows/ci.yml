name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create test temp directory
        run: mkdir -p /tmp/revo

      - name: Run YAML parser tests
        run: bash test/test_yaml.sh

      - name: Run config tests
        run: bash test/test_config.sh

      - name: Run scan tests
        run: bash test/test_scan.sh

      - name: Run database tests
        run: bash test/test_db.sh

      - name: Run workspace tests
        run: bash test/test_workspace.sh

      - name: Run integration tests
        run: bash test/test_integration.sh

      - name: Verify dist/revo is up to date
        run: |
          ./build.sh
          git diff --exit-code -- dist/revo \
            || { echo "::error::dist/revo is stale. Run ./build.sh and commit the result."; exit 1; }
